name: "Workflow Status Action"
description: "Trigger events like notifications or alerts using the workflow status"
author: "David Boenig <martialonline>"
outputs:
  status:
    description: "Returns either success or failed as workflow status"
    value: ${{ steps.workflow-status.outputs.status }}
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - id: workflow-status
      env:
        TOKEN: ${{ github.token }}
      run: "url=\"${GITHUB_API_URL}/repos\"\nrepo=\"${GITHUB_REPOSITORY}\"\nrun_id=\"${GITHUB_RUN_ID}\"\ntoken=\"${TOKEN}\"\n\nfailure=$(curl -s -H \"Authorization: token ${token}\" \"${url}/${repo}/actions/runs/${run_id}/jobs\" | \\\njq -r '.jobs[] | select(.status == \"completed\" and .conclusion == \"failure\").conclusion' | \\\nwc -l)\n\ncancelled=$(curl -s -H \"Authorization: token ${token}\" \"${url}/${repo}/actions/runs/${run_id}/jobs\" | \\\njq -r '.jobs[] | select(.status == \"completed\" and .conclusion == \"cancelled\").conclusion' | \\\nwc -l)\n\nif [ \"${failure}\" -gt 0 ]; then\n  status=\"failure\"\nelif [ \"${cancelled}\" -gt 0 ]; then\n  status=\"cancelled\"\nelse \n  status=\"success\"\nfi\n\necho \"status=${status}\" >> $GITHUB_OUTPUT\n"
      shell: bash
branding:
  icon: check-square
  color: gray-dark
