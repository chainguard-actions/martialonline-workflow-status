name: Test basic usage - status output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert status output is valid or action failed gracefully
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: '$STATUS'"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — status must be one of the valid values
            case "$STATUS" in
              success|failure|cancelled)
                echo "PASS: status is '$STATUS'"
                ;;
              *)
                echo "FAIL: unexpected status value '$STATUS'"
                exit 1
                ;;
            esac
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
