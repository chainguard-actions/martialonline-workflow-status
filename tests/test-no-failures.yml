name: Test workflow status - no failures yields success
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action queries the GitHub API for jobs in the current run.
      # Under the harness, GITHUB_REPOSITORY is a sentinel that does not exist,
      # so the API returns an error/empty response. With 0 failures and 0 cancellations,
      # the action should output "success".
      - id: action
        uses: .
        continue-on-error: true

      - name: Assert status is success when no failures detected
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            # When the API returns empty/null jobs, failure and cancelled counts are 0
            # so the action should report success
            if [ "$STATUS" != "success" ]; then
              echo "FAIL: expected 'success' but got '$STATUS'"
              exit 1
            fi
            echo "PASS: status is 'success' as expected when no failures found"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
