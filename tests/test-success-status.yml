name: Test success status - no failures detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert status is success or action failed gracefully
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          # Under the harness, GITHUB_REPOSITORY is a sentinel so the API call
          # returns an error/empty response. jq returns nothing, wc -l returns 0,
          # so the action should output status=success.
          if [ "$OUTCOME" = "success" ]; then
            if [ "$STATUS" != "success" ]; then
              echo "FAIL: expected status 'success' when no failures detected, got '$STATUS'"
              exit 1
            fi
            echo "PASS: status is 'success' as expected when no failures are detected"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
